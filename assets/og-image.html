<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>OG image — بوابة مصادر السيارات التونسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #05070a;
        font-family: "Tajawal", sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      #og {
        width: 1200px;
        height: 630px;
        flex: none;
        background: #0f1115;
        position: relative;
        overflow: hidden;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 58px 72px 54px;
      }
      .top-bar {
        position: absolute; top: 0; right: 0;
        width: 1200px; height: 10px; background: #f59e0b;
      }
      .glow-a {
        position: absolute; left: -140px; top: -160px;
        width: 460px; height: 460px; border-radius: 50%;
        background: #17222f;
      }
      .glow-b {
        position: absolute; right: -120px; bottom: -180px;
        width: 420px; height: 420px; border-radius: 50%;
        background: #141b23;
      }
      .head {
        display: flex; align-items: center; gap: 18px;
        position: relative; z-index: 1;
      }
      .badge {
        width: 58px; height: 58px; border-radius: 16px;
        background: #f59e0b; color: #0f1115;
        display: flex; align-items: center; justify-content: center;
        font-size: 25px; font-weight: 700; letter-spacing: -1px;
        font-family: Arial, sans-serif;
      }
      .kicker-ar { font-size: 27px; font-weight: 700; color: #e2e8f0; }
      .kicker-en { font-size: 22px; color: #8b9bb0; direction: ltr; text-align: right; }

      .middle { display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 1; }
      h1 { font-size: 72px; line-height: 1.18; font-weight: 700; color: #f8fafc; }
      .sub { display: flex; align-items: center; gap: 16px; }
      .rule { width: 64px; height: 6px; border-radius: 999px; background: #f59e0b; flex: none; }
      .sub span { font-size: 32px; color: #c3cfdd; }

      .foot {
        display: flex; align-items: center; justify-content: space-between;
        position: relative; z-index: 1;
      }
      .stats { display: flex; gap: 14px; }
      .chip {
        display: flex; align-items: baseline; gap: 8px;
        padding: 10px 20px; border-radius: 14px;
        background: #1b2632; border: 1px solid #2b3a4a;
      }
      .chip b { font-size: 30px; font-weight: 700; color: #fbbf24; }
      .chip em { font-style: normal; font-size: 21px; color: #aebccd; }
      .domain { font-size: 22px; color: #7d8fa3; direction: ltr; }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="top-bar"></div>
      <div class="glow-a"></div>
      <div class="glow-b"></div>

      <div class="head">
        <div class="badge">OBD</div>
        <div>
          <div class="kicker-ar">دليل عملي للورشات التونسية</div>
          <div class="kicker-en">Automotive repair sources · Tunisia</div>
        </div>
      </div>

      <div class="middle">
        <h1>بوابة مصادر السيارات التونسية</h1>
        <div class="sub">
          <div class="rule"></div>
          <span>تشخيص وإصلاح السيارات بمصادر موثوقة وأكواد OBD-II</span>
        </div>
      </div>

      <div class="foot">
        <div class="stats">
          <div class="chip"><b>141</b><em>مصدر موثوق</em></div>
          <div class="chip"><b>442</b><em>كود OBD-II</em></div>
          <div class="chip"><b>38</b><em>عرضًا تشخيصيًا</em></div>
        </div>
        <div class="domain">tunisian-auto-sources</div>
      </div>
    </div>
  </body>
</html>
